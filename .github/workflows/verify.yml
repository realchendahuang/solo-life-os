name: Verify X-Tiller

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # PyYAML is the repository's only third-party dependency; without it the
      # frontmatter layer cannot import and the tests die with a bare
      # ModuleNotFoundError. requirements.txt pins it so CI matches local runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - run: python -m unittest discover -s tests -p 'test_*.py'
